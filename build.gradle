plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.+' // ForgeGradle → NeoGradle
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name // java.archivesBaseName → base.archivesName
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21) // 1.21.1 requer Java 21
}

// NeoForge usa o bloco `runs` diretamente, sem o bloco `minecraft {}`
runs {
    client {
        client()
        workingDirectory project.file('run')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource sourceSets.main
    }

    server {
        server()
        workingDirectory project.file('run/server')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource sourceSets.main
    }

    gameTestServer {
        type = net.neoforged.gradle.dsl.common.runs.type.RunType.GAME_TEST_SERVER
        workingDirectory project.file('run/gametestserver')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource sourceSets.main
    }

    data {
        data()
        workingDirectory project.file('run')
        programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        modSource sourceSets.main
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
        name = "Modrinth"
    }
    flatDir {
        name "extra-mods"
        dir file("extra-mods")
    }
}

dependencies {
    // NeoForge: sem fg.deobf, sem "minecraft", direto como implementation
    implementation "net.neoforged:neoforge:${project.neoforge_version}"

    // Balm e Waystones: sem fg.deobf no NeoGradle
    implementation "maven.modrinth:balm:${project.balm_version}"
    implementation "maven.modrinth:waystones:${project.waystones_version}"

    // Extra mods locais para runtime
    for (extraModJar in fileTree(dir: "extra-mods", include: '*.jar')) {
        def basename = extraModJar.name.substring(0, extraModJar.name.length() - ".jar".length())
        def versionSep = basename.lastIndexOf('-')
        assert versionSep != -1
        def artifactId = basename.substring(0, versionSep)
        def version = basename.substring(versionSep + 1)
        runtimeOnly "extra-mods:$artifactId:$version"
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    manifest {
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.mod_author,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : project.mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// jar.finalizedBy('reobfJar') — REMOVIDO: NeoForge não usa reobfuscação
// O jar final já sai com os nomes corretos (Mojang mappings por padrão)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
